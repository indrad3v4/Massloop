name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: massloop-be
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Import smoke gate: would have caught the old IndentationError in
      # app/services/externals.py (docs/roast_infrastructure.md C2).
      - name: Import smoke test
        run: |
          python -c "import app.main"
          python -c "import app.services.externals"

      - name: Run tests
        run: python -m pytest tests/ -q
